<!DOCTYPE html>
<html>
<head>
<title>Zyntrix AI</title>

<style>
input{
    flex:1;
    height:48px;
    padding:0 16px;
    border-radius:25px;
    border:1px solid #333;
    background:#0f1115;
    color:white;
    outline:none;
    font-size:16px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.input-area{
    display:flex;
    gap:10px;
    margin-top:15px;
    align-items:center;
    flex-wrap:nowrap;
}

@media (max-width:768px){

    .input-area{
        flex-wrap:nowrap;
    }

    input{
        font-size:15px;
        height:46px;
    }

    button{
        height:46px;
    }
}
/* 🌌 BACKGROUND */
body{
    margin:0;
    font-family:Segoe UI;
    background:linear-gradient(-45deg,#0b0f14,#111827,#0e1116);
    background-size:400% 400%;
    animation:bg 8s ease infinite;
    display:flex;
    justify-content:center;
    min-height:100vh;
    overflow-y:auto;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* 🧱 MAIN BOX (AUTO RESIZE) */
.container{
    width:750px;
    margin:40px 0;
    background:#161b22;
    padding:18px;
    border-radius:18px;
    box-shadow:0 0 25px rgba(255,255,255,0.08);
    height:auto;
}

/* ✨ TITLE */
h1{
    text-align:center;
    color:white;
    animation:glow 2s infinite alternate;
}

@keyframes glow{
    from{text-shadow:0 0 5px white;}
    to{text-shadow:0 0 15px #aaa;}
}

/* 💬 CHAT AREA (AUTO HEIGHT) */
.chat{
    background:#0f1115;
    border:1px solid #2a2a2a;
    padding:15px;
    border-radius:12px;
    height:auto;
    overflow-wrap:break-word;
}

/* 👤 USER */
.user{
    background:white;
    color:black;
    padding:12px;
    border-radius:14px;
    margin:10px 0;
    margin-left:auto;
    width:fit-content;
    max-width:70%;

    animation:slideR 0.3s ease;
}

@keyframes slideR{
    from{opacity:0; transform:translateX(20px);}
    to{opacity:1; transform:translateX(0);}
}

/* 🤖 BOT */
.bot{
    background:#1e1e2a;
    color:white;
    padding:12px;
    border-radius:14px;
    margin:10px 0;
    max-width:80%;

    animation:slideL 0.3s ease;
}

@keyframes slideL{
    from{opacity:0; transform:translateX(-20px);}
    to{opacity:1; transform:translateX(0);}
}

/* ⌨️ INPUT AREA */
.input-area{
    display:flex;
    gap:10px;
    margin-top:12px;
}

input{
    flex:1;
    padding:12px;
    border-radius:25px;
    border:1px solid #333;
    background:#0f1115;
    color:white;
    outline:none;
}

/* 🔘 BUTTONS */
button{
    padding:12px 16px;
    border:none;
    border-radius:25px;
    cursor:pointer;
    background:white;
    color:black;
    font-weight:600;
    transition:0.2s;
}

button:hover{
    transform:scale(1.05);
}

button.search{
    background:#3b82f6;
    color:white;
}

</style>
<style>

body { ... }

/* your existing CSS */

/* 👇 PASTE SETTINGS CSS HERE */
.settings-btn{
    position:fixed;
    right:20px;
    bottom:20px;
    width:50px;
    height:50px;
    border-radius:50%;
    font-size:20px;
    background:#1e293b;
    color:white;
    transition:.3s;
    z-index:1000;
    box-shadow:0 0 15px rgba(255,255,255,.2);
}

.settings-btn:hover{
    transform:rotate(90deg) scale(1.1);
    box-shadow:0 0 25px white;
}
.overlay { ... }
.settings-menu { ... }

</style>
</head>

<body>

<div class="container">

<h1>⚡ Zyntrix AI</h1>
<button id="settingsBtn" class="settings-btn">⚙</button>

<div id="overlay" class="overlay"></div>

<div id="settingsMenu" class="settings-menu">
    <h2>Settings</h2>

    <div class="setting">
        <label>Dark Mode</label>
        <input type="checkbox" id="darkmode" checked>
    </div>

    <div class="setting">
        <label>Animations</label>
        <input type="checkbox" id="animations" checked>
    </div>

    <div class="setting">
        <label>Font Size</label>
        <select id="fontsize">
            <option value="14px">Small</option>
            <option value="16px" selected>Medium</option>
            <option value="18px">Large</option>
        </select>
    </div>

    <button onclick="closeSettings()">Close</button>
</div>
<div class="chat">

{% if msg %}
<div class="user">You: {{msg}}</div>
{% endif %}

{% if answer %}
<div class="bot">Zyntrix AI: {{answer|safe}}</div>
{% endif %}

</div>

<form method="POST">

<div class="input-area">

<input type="text" name="message" placeholder="Ask Zyntrix AI..." required>

<button name="action" value="chat">Chat</button>
<button name="action" value="search" class="search">Search</button>

</div>

</form>

</div>

</body>
<script>

const menu = document.getElementById("settingsMenu");
const overlay = document.getElementById("overlay");

document.getElementById("settingsBtn").onclick = function(){
    menu.style.display = "block";
    overlay.style.display = "block";
}

function closeSettings(){
    menu.style.display = "none";
    overlay.style.display = "none";
}

document.getElementById("fontsize").onchange = function(){
    document.body.style.fontSize = this.value;
}

document.getElementById("darkmode").onchange = function(){
    if(this.checked){
        document.body.style.background="#0b0f14";
    } else {
        document.body.style.background="#eee";
    }
}

document.getElementById("animations").onchange = function(){
    if(this.checked){
        document.body.style.animation="bg 8s ease infinite";
    } else {
        document.body.style.animation="none";
    }
}

</script>
</html>
